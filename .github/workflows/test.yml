name: Tests

on:
  push:
    branches:
      - main
      - develop
      - release/v*
  pull_request:
    branches:
      - main
      - develop
      - release/v*
  schedule:
    # 12:00 (JST) every Sunday
    - cron: '0 3 * * 0'

permissions:
  contents: read

# Cancel in-progress runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        # Ubuntu 20.04: Python 3.8, 3.9
        # Ubuntu 22.04: Python 3.10, 3.11
        # Ubuntu 24.04: Python 3.12
        # Ubuntu 26.04: Python 3.14
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # NOTE: --locked fails if uv.lock is out of sync with pyproject.toml.
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --locked --all-extras --dev

    - name: Prepare Makefile
      run: |
        cp -f Makefile.example Makefile

    - name: Check formatting with ruff
      run: |
        make format

    - name: Lint with ruff
      run: |
        make lint

    - name: Type check with ty
      run: |
        make typecheck

    # NOTE: Test __main__
    - name: Show help/version and exit
      run: |
        make show-usage

    - name: Test with pytest
      run: |
        make test
