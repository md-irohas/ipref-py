version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      # Group all GitHub Actions updates into a single pull request.
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      # Group development dependencies into a single pull request.
      dev-dependencies:
        dependency-type: "development"
