version: 2
project_name: ipref-py

# ./dist/ conflicts with python's build package, so change it to ./dist-release/
dist: ./dist-release/

builds:
  - skip: true

changelog:
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

  filters:
    exclude:
      # - "^build"
      # - "^chore"
      # - "^ci"
      # - "^docs"
      # - "^test"
      - "^Merge"

release:
  prerelease: auto
  footer: |
    ## Full Changelog
    https://github.com/md-irohas/ipref-py/compare/{{ .PreviousTag }}...{{ .Tag }}
  extra_files:
    - glob: ./dist/ipref*
